name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: SQLite tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      USE_SQLITE: "1"
      SQLITE_DB: "./data.sqlite3"
      JWT_SECRET: "ci-test-secret"
      REQUIRE_JWT_SECRET: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Migrate to SQLite
        run: python migrate_to_sqlite.py
      - name: Run tests
        run: python -m pytest -q

  orm-test:
    name: ORM + Alembic
    runs-on: ubuntu-latest
    needs: test
    env:
      DB_ENGINE: "orm"
      USE_SQLALCHEMY: "1"
      SQLALCHEMY_DATABASE_URI: "sqlite:///./data-orm.sqlite3"
      JWT_SECRET: "ci-test-secret"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Seed DB and run tests
        run: |
          python migrate_to_sqlite.py
          python -m pytest -q

  redis-test:
    name: Redis throttle test
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_URL: "redis://localhost:6379/0"
      ALLOW_REDIS_FLUSH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with Redis
        run: python -m pytest tests/test_throttle_redis.py -q
