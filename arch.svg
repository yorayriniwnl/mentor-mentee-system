<svg width="1100" height="430" viewBox="0 0 1100 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#E84B4B" stroke-opacity=".1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6" stroke="#FF8A7F" stroke-width="1"/>
    </marker>
    <style>
      .label{font:600 11px Consolas,monospace;letter-spacing:3px;fill:#FF8A7F}
      .title{font:18px Georgia,serif;fill:#F5EAEA}
      .copy{font:12px Consolas,monospace;fill:#C4C4C4}
      .box{fill:#050505;stroke:#F5EAEA;stroke-opacity:.2}
      .hot{fill:#2A0505;stroke:#E84B4B;stroke-opacity:.8}
      .link{stroke:#FF8A7F;stroke-opacity:.55;stroke-width:1;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="430" fill="#000000"/>
  <rect width="1100" height="430" fill="url(#grid)"/>
  <text x="40" y="40" class="label">YOR // SYSTEM MAP / v1</text>

  <text x="40" y="86" class="label">SURFACE</text>
  <rect x="40" y="104" width="230" height="78" rx="2" class="box"/>
  <text x="60" y="135" class="title">Browser demo</text>
  <text x="60" y="158" class="copy">Flask HTML client</text>
  <text x="60" y="174" class="copy">DEMO / root route</text>
  <rect x="290" y="104" width="230" height="78" rx="2" class="box"/>
  <text x="310" y="135" class="title">REST API</text>
  <text x="310" y="158" class="copy">auth + workflow routes</text>
  <text x="310" y="174" class="copy">VERIFIED / tests</text>
  <rect x="540" y="104" width="230" height="78" rx="2" class="box"/>
  <text x="560" y="135" class="title">Tkinter GUI</text>
  <text x="560" y="158" class="copy">local desktop client</text>
  <text x="560" y="174" class="copy">EXPERIMENTAL / local</text>
  <rect x="790" y="104" width="270" height="78" rx="2" class="hot"/>
  <text x="810" y="135" class="title">CLI walkthrough</text>
  <text x="810" y="158" class="copy">login → match → request</text>
  <text x="810" y="174" class="copy">evidence / isolated store</text>

  <text x="40" y="226" class="label">DOMAIN</text>
  <rect x="40" y="244" width="230" height="78" rx="2" class="box"/>
  <text x="60" y="275" class="title">auth.py</text>
  <text x="60" y="298" class="copy">password + JWT</text>
  <text x="60" y="314" class="copy">identity boundary</text>
  <rect x="290" y="244" width="230" height="78" rx="2" class="hot"/>
  <text x="310" y="275" class="title">matching.py</text>
  <text x="310" y="298" class="copy">weighted score / 0–100</text>
  <text x="310" y="314" class="copy">skills · time · depth · trust</text>
  <rect x="540" y="244" width="230" height="78" rx="2" class="box"/>
  <text x="560" y="275" class="title">booking.py</text>
  <text x="560" y="298" class="copy">sessions + feedback</text>
  <text x="560" y="314" class="copy">request lifecycle</text>
  <rect x="790" y="244" width="270" height="78" rx="2" class="box"/>
  <text x="810" y="275" class="title">messaging.py</text>
  <text x="810" y="298" class="copy">conversation records</text>
  <text x="810" y="314" class="copy">analytics + reporting</text>

  <text x="40" y="366" class="label">DATA / DELIVERY</text>
  <rect x="40" y="382" width="310" height="30" rx="2" class="box"/>
  <text x="58" y="402" class="copy">JSON fallback → SQLite / SQLAlchemy</text>
  <rect x="380" y="382" width="310" height="30" rx="2" class="box"/>
  <text x="398" y="402" class="copy">Alembic migrations / durable path</text>
  <rect x="720" y="382" width="340" height="30" rx="2" class="box"/>
  <text x="738" y="402" class="copy">GitHub Actions → Vercel config</text>

  <path d="M270 143H286" class="link"/>
  <path d="M520 143H536" class="link"/>
  <path d="M770 143H786" class="link"/>
  <path d="M405 182V240" class="link"/>
  <path d="M655 182V240" class="link"/>
  <path d="M905 182V240" class="link"/>
</svg>
